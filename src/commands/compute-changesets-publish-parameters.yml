description: >
  Write /tmp/pipeline-parameters.json (or OUTPUT_PATH) with
  {"run-changesets-publish": true|false, "offer-promote-prod": true|false} from git diff against
  origin/<base-revision>. Path signal matches release-related paths (CHANGELOG.md or package.json
  top-level version changes). run-changesets-publish requires that path signal plus a HEAD subject
  matching release-merge-subject-regex (default: version-packages release merges). offer-promote-prod
  additionally requires an open .releases/<cycle-id>/cycle.yml (no promotedAt). Pair with
  circleci/continuation continue (pipeline parameters) and/or a gated-publish job pre-step that reads
  the same JSON. Optionally forward CIRCLE_PULL_REQUEST and CIRCLE_PR_NUMBER as continuation pipeline
  parameters (include-pr-metadata) because setup workflows do not propagate those env vars into
  continuation pipelines (for example Codecov PR association). Requires git, jq, and fetch access to
  origin. Install jq first (for example circleci/jq jq/install) when using minimal images such as
  cimg/base.

parameters:
  base-revision:
    type: string
    default: master
    description: Remote base branch name (fetches origin/<value>).
  output-path:
    type: string
    default: /tmp/pipeline-parameters.json
    description: Path for JSON written for continuation/continue parameters.
  same-base-run:
    type: boolean
    default: true
    description: When false, skip publish flag when merge-base equals CIRCLE_SHA1 (path-filtering style).
  include-pr-metadata:
    type: boolean
    default: false
    description: >
      When true, also write circle_pull_request and circle_pr_number (empty string when unset) for
      continuation pipeline.parameters. CIRCLE_PR_NUMBER falls back to the trailing path segment of
      CIRCLE_PULL_REQUEST when the number env var is empty.
  release-merge-subject-regex:
    type: string
    default: "^chore\\(release\\): version packages"
    description: >
      Extended regex matched against the HEAD commit subject. Required (with path signal) for
      run-changesets-publish and offer-promote-prod. Align with assert-release-merge /
      changesets-gated-publish.
  releases-dir:
    type: string
    default: .releases
    description: >
      Directory scanned for open release cycles when computing offer-promote-prod (cycle.yml without
      promotedAt).

steps:
  - run:
      name: Compute Changesets publish and promote-prod pipeline parameters
      environment:
        BASE_REVISION: << parameters.base-revision >>
        OUTPUT_PATH: << parameters.output-path >>
        SAME_BASE_RUN: << parameters.same-base-run >>
        INCLUDE_PR_METADATA: << parameters.include-pr-metadata >>
        RELEASE_MERGE_SUBJECT_REGEX: << parameters.release-merge-subject-regex >>
        RELEASES_DIR: << parameters.releases-dir >>
      command: << include(scripts/computeChangesetsPublishParameters.sh) >>
