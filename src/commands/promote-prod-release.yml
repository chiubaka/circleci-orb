description: >
  Finalize a release cycle for production (ADR 0041 / ADR 0043): exit Changesets
  prerelease and cut stable semver when applicable, refresh highest RC manifest pins,
  set promotedAt on cycle.yml, write release-notes.md rollup, commit, push
  prod-<cycle-id>, and create the canonical GitHub Release.
  Run after staging sign-off on the validated merge commit.

parameters:
  app-dir:
    type: string
    default: "."
  primary-branch:
    type: string
    default: "master"
    description: Branch to push finalized cycle.yml and release-notes.md to.
  create-github-release:
    type: boolean
    default: true
    description: When true, create GitHub Release titled with the cycle id and release-notes.md body.
  on-existing-tag:
    type: enum
    enum:
      - skip
      - fail
    default: skip
    description: Idempotency when prod-<cycle-id> already exists at the target SHA.
  release-id:
    type: string
    default: ""
    description: Optional cycle id override (YYYY.MM.DD.N). When empty, inferred from .releases/ on the commit.
  target-ref:
    type: string
    default: "<< pipeline.git.revision >>"
    description: Commit to finalize and tag (defaults to pipeline revision).
  tag-target:
    type: enum
    enum:
      - finalize
      - validated
    default: finalize
    description: >
      Which commit prod-<cycle-id> and the GitHub Release target. finalize (default) tags
      the finalize commit on primary-branch (required after ADR 0043 stable cut). validated
      tags the pre-finalize target-ref and is only valid when no prerelease exit ran (hotfix/legacy).
  deployable-packages:
    type: string
    default: ""
    description: >
      Comma-separated key=path pairs for deployables. Required when the cycle is in Changesets
      prerelease mode so production finalization can refresh stable manifest pins (ADR 0043).
  stable-publish-script:
    type: string
    default: ""
    description: >
      Optional package.json script name run after the stable version cut (pnpm run <name>) to
      publish/tag stable artifacts. When empty, operators must publish stable tags out of band.
  release-notes-grouping:
    type: enum
    enum:
      - bump-type
      - category
    default: category
    description: Changelog category rewrite grouping after the stable version cut.
  release-notes-nesting:
    type: enum
    enum:
      - package-then-category
      - category-then-package
    default: package-then-category
    description: >
      Nesting for batch-formatted release notes (package-then-category default).

steps:
  - install-github-cli
  - run:
      name: Stage Chiubaka release notes formatter
      working_directory: << parameters.app-dir >>
      command: << include(scripts/stageFormatChangesetsBatchReleaseNotes.sh) >>
  - run:
      name: Stage release cycle scripts
      working_directory: << parameters.app-dir >>
      command: << include(scripts/stageReleaseCycleWriter.sh) >>
  - run:
      name: Promote production release cycle
      working_directory: << parameters.app-dir >>
      command: << include(scripts/runPromoteProdRelease.sh) >>
      environment:
        APP_DIR: .
        PRIMARY_BRANCH: << parameters.primary-branch >>
        CREATE_GITHUB_RELEASE: << parameters.create-github-release >>
        ON_EXISTING_TAG: << parameters.on-existing-tag >>
        RELEASE_ID: << parameters.release-id >>
        TARGET_REF: << parameters.target-ref >>
        TAG_TARGET: << parameters.tag-target >>
        DEPLOYABLE_PACKAGES: << parameters.deployable-packages >>
        STABLE_PUBLISH_SCRIPT: << parameters.stable-publish-script >>
        RELEASE_NOTES_GROUPING: << parameters.release-notes-grouping >>
        RELEASE_NOTES_NESTING: << parameters.release-notes-nesting >>
        FINALIZE_RELEASE_CYCLE_SCRIPT: /tmp/chiubaka-release-cycle/finalizeReleaseCycle.mjs
        RESOLVE_RELEASE_CYCLE_SCRIPT: /tmp/chiubaka-release-cycle/resolveReleaseCycleOnCommit.mjs
        ROLLUP_RELEASE_NOTES_SCRIPT: /tmp/chiubaka-release-cycle/rollupReleaseNotes.mjs
        REFRESH_HIGHEST_RC_MANIFEST_PINS_SCRIPT: /tmp/chiubaka-release-cycle/refreshHighestRcManifestPins.mjs
        REWRITE_CHANGELOG_CATEGORIES_SCRIPT: /tmp/chiubaka-rewriteChangelogCategories.mjs
        CHANGESET_CATEGORY_PREFIXES_SCRIPT: /tmp/chiubaka-changesetCategoryPrefixes.mjs
