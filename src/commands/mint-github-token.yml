description: >
  Export GITHUB_TOKEN (and GH_TOKEN) for downstream orb steps. When GITHUB_APP_ID,
  GITHUB_APP_PRIVATE_KEY, and GITHUB_APP_INSTALLATION_ID are set in the environment,
  mints a short-lived GitHub App installation access token. When none of those are set
  but GITHUB_TOKEN is already provided (for example from a CircleCI context PAT), uses
  that value unchanged. Appends exports to BASH_ENV when present so later steps in the
  same job inherit the token.

  Prefer running this after setup / pnpm install (changesets-release-pr,
  changesets-gated-publish, and promote-prod-release mint after install by default).
  A pre-step mint is unnecessary for those jobs and replaces packages-read auth
  before install; if you still mint early, mintGithubToken preserves the previous
  GITHUB_TOKEN as GITHUB_PACKAGES_READ_TOKEN (and deprecated GITHUB_PACKAGES_TOKEN)
  so install can use it. Prefer providing install auth as GITHUB_PACKAGES_READ_TOKEN
  (e.g. github-packages-read context) so it never collides with minted GITHUB_TOKEN.

parameters:
  github-api-url:
    type: string
    default: "https://api.github.com"
    description: >
      GitHub REST API base URL. Override for GitHub Enterprise Server; github.com
      installations use the default.

steps:
  - run:
      name: Mint or resolve GitHub token
      command: << include(scripts/mintGithubToken.sh) >>
      environment:
        GITHUB_API_URL: << parameters.github-api-url >>
