description: >
  Validate pin-only .releases/<cycle-id>/ release cycle trees (ADR 0041, ADR 0042; pin-only fields
  remain ADR 0039). By default (mode=changed) validates only cycle directories that changed vs the
  primary-branch merge base (plus untracked/cached for local parity); set mode=all to validate every
  cycle under .releases/. Safe to run on every PR — when nothing changed, exits 0 without validating.
  Fails fast with actionable errors on schema violations or when the merge base cannot be computed.

parameters:
  app-dir:
    type: string
    default: "."
    description: Monorepo root containing .releases/.
  mode:
    type: enum
    enum:
      - changed
      - all
    default: changed
    description: >
      changed validates cycles touched vs primary-branch merge base (and untracked/cached); all
      validates every .releases/<cycle-id>/.
  primary-branch:
    type: string
    default: "master"
    description: >
      Branch used as the merge-base for mode=changed. Must exist locally or on origin (setup fetches
      it when this command runs after chiubaka/setup).

steps:
  - run:
      name: Stage release cycle scripts
      working_directory: << parameters.app-dir >>
      command: << include(scripts/stageReleaseCycleWriter.sh) >>
  - run:
      name: Verify release cycle manifests
      working_directory: << parameters.app-dir >>
      command: << include(scripts/runVerifyReleaseManifest.sh) >>
      environment:
        APP_DIR: .
        PRIMARY_BRANCH: << parameters.primary-branch >>
        VERIFY_RELEASE_MANIFEST_MODE: << parameters.mode >>
        VALIDATE_RELEASE_CYCLE_SCRIPT: /tmp/chiubaka-release-cycle/validateReleaseCycle.mjs
        VALIDATE_RELEASE_MANIFEST_SCRIPT: /tmp/chiubaka-release-cycle/validateReleaseManifest.mjs
