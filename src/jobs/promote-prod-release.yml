description: >
  Finalize a deployable application release cycle for production (ADR 0041 / ADR 0043):
  optional prerelease exit and stable version cut, promotedAt, release-notes.md rollup,
  prod-<cycle-id> tag, and canonical GitHub Release. By default mints GITHUB_TOKEN after
  setup/install (mint-github-token: true) so packages-read auth survives pnpm install; a
  pre-steps mint is unnecessary.

executor:
  name: docker-node
  resource-class: << parameters.resource-class >>

parameters:
  app-dir:
    type: string
    default: "."
  primary-branch:
    type: string
    default: "master"
  configure-git-user:
    type: boolean
    default: true
    description: >
      Configure global git user before finalize commit and annotated prod tag.
      CircleCI Docker executors have no default identity.
  create-github-release:
    type: boolean
    default: true
  git-user-email:
    type: string
    default: circleci@chiubaka.com
    description: Git user email when configure-git-user is true.
  git-user-name:
    type: string
    default: CircleCI
    description: Git user name when configure-git-user is true.
  on-existing-tag:
    type: enum
    enum:
      - skip
      - fail
    default: skip
  release-id:
    type: string
    default: ""
  target-ref:
    type: string
    default: ""
    description: >
      Commit to finalize and tag. Empty (default) falls back to CIRCLE_SHA1 or HEAD
      in the script so config compile does not require pipeline.git.revision.
  tag-target:
    type: enum
    enum:
      - finalize
      - validated
    default: finalize
    description: >
      Which commit prod-<cycle-id> and the GitHub Release target. finalize tags the
      finalize commit; validated tags the pre-finalize target-ref commit only when no
      ADR 0043 stable cut ran (hotfix/legacy).
  deployable-packages:
    type: string
    default: ""
    description: >
      Required when exiting Changesets prerelease to refresh stable manifest pins.
  stable-publish-script:
    type: string
    default: ""
  release-notes-grouping:
    type: enum
    enum:
      - bump-type
      - category
    default: category
  release-notes-nesting:
    type: enum
    enum:
      - package-then-category
      - category-then-package
    default: package-then-category
  resource-class:
    default: medium
    enum:
      - small
      - medium
      - medium+
      - large
      - xlarge
      - 2xlarge
      - 2xlarge+
    type: enum
  skip-install:
    type: boolean
    default: false
    description: >
      Skip pnpm install. Set false (default) when production finalization may run
      changeset pre exit / changeset version (ADR 0043).
  mint-github-token:
    type: boolean
    default: true
    description: >
      When true (default), mint or resolve GITHUB_TOKEN after setup/install and before
      git/gh steps. Prefer this over a pre-steps mint so pnpm install keeps the
      packages-read GITHUB_TOKEN. A pre-step mint is unnecessary.

steps:
  - setup:
      app-dir: << parameters.app-dir >>
      checkout: true
      primary-branch: << parameters.primary-branch >>
      skip-pnpm-install: << parameters.skip-install >>
  - when:
      condition: << parameters.mint-github-token >>
      steps:
        - mint-github-token
  - when:
      condition: << parameters.configure-git-user >>
      steps:
        - run:
            name: Configure git user
            working_directory: << parameters.app-dir >>
            environment:
              GIT_USER_NAME: << parameters.git-user-name >>
              GIT_USER_EMAIL: << parameters.git-user-email >>
            command: |
              git config --global user.name "$GIT_USER_NAME"
              git config --global user.email "$GIT_USER_EMAIL"
  - promote-prod-release:
      app-dir: << parameters.app-dir >>
      primary-branch: << parameters.primary-branch >>
      create-github-release: << parameters.create-github-release >>
      on-existing-tag: << parameters.on-existing-tag >>
      release-id: << parameters.release-id >>
      target-ref: << parameters.target-ref >>
      tag-target: << parameters.tag-target >>
      deployable-packages: << parameters.deployable-packages >>
      stable-publish-script: << parameters.stable-publish-script >>
      release-notes-grouping: << parameters.release-notes-grouping >>
      release-notes-nesting: << parameters.release-notes-nesting >>
