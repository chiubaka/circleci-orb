description: >
  Finalize a deployable application release cycle for production (ADR 0041 / ADR 0043):
  optional prerelease exit and stable version cut, promotedAt, release-notes.md rollup,
  prod-<cycle-id> tag, and canonical GitHub Release.

executor:
  name: docker-node
  resource-class: << parameters.resource-class >>

parameters:
  app-dir:
    type: string
    default: "."
  primary-branch:
    type: string
    default: "master"
  create-github-release:
    type: boolean
    default: true
  on-existing-tag:
    type: enum
    enum:
      - skip
      - fail
    default: skip
  release-id:
    type: string
    default: ""
  target-ref:
    type: string
    default: "<< pipeline.git.revision >>"
    description: Commit to finalize and tag (defaults to pipeline revision).
  tag-target:
    type: enum
    enum:
      - finalize
      - validated
    default: finalize
    description: >
      Which commit prod-<cycle-id> and the GitHub Release target. finalize tags the
      finalize commit; validated tags the pre-finalize target-ref commit only when no
      ADR 0043 stable cut ran (hotfix/legacy).
  deployable-packages:
    type: string
    default: ""
    description: >
      Required when exiting Changesets prerelease to refresh stable manifest pins.
  stable-publish-script:
    type: string
    default: ""
  release-notes-grouping:
    type: enum
    enum:
      - bump-type
      - category
    default: category
  release-notes-nesting:
    type: enum
    enum:
      - package-then-category
      - category-then-package
    default: package-then-category
  resource-class:
    default: medium
    enum:
      - small
      - medium
      - medium+
      - large
      - xlarge
      - 2xlarge
      - 2xlarge+
    type: enum
  skip-install:
    type: boolean
    default: false
    description: >
      Skip pnpm install. Set false (default) when production finalization may run
      changeset pre exit / changeset version (ADR 0043).

steps:
  - setup:
      app-dir: << parameters.app-dir >>
      checkout: true
      skip-pnpm-install: << parameters.skip-install >>
  - promote-prod-release:
      app-dir: << parameters.app-dir >>
      primary-branch: << parameters.primary-branch >>
      create-github-release: << parameters.create-github-release >>
      on-existing-tag: << parameters.on-existing-tag >>
      release-id: << parameters.release-id >>
      target-ref: << parameters.target-ref >>
      tag-target: << parameters.tag-target >>
      deployable-packages: << parameters.deployable-packages >>
      stable-publish-script: << parameters.stable-publish-script >>
      release-notes-grouping: << parameters.release-notes-grouping >>
      release-notes-nesting: << parameters.release-notes-nesting >>
