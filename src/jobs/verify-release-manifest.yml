description: >
  PR check for .releases/** changes: validates pin-only release cycle trees (ADR 0041 / ADR 0042;
  pin-only RC fields remain ADR 0039). Safe to schedule on every PR so a required GitHub check
  always reports — default mode=changed validates only cycles touched vs the primary-branch merge
  base and skips with exit 0 when none changed. PNPM install is skipped by default (validators are
  orb-staged Node). Path-filtering the workflow to .releases/** is optional and incompatible with a
  required GitHub check unless the consumer adds a stub job. Pair with verify-changesets for
  application monorepos.

executor:
  name: docker-node
  resource-class: << parameters.resource-class >>

parameters:
  app-dir:
    type: string
    default: "."
  attach-workspace:
    type: boolean
    default: false
  checkout:
    type: boolean
    default: true
  init-submodules:
    type: boolean
    default: false
  primary-branch:
    type: string
    default: "master"
    description: >
      Primary branch used as the merge-base for mode=changed. chiubaka/setup fetches it on origin;
      changed mode requires that ref to exist.
  resource-class:
    default: small
    description: >
      Defaults to small because skip-install is true. Pass medium (or larger) if you set
      skip-install: false and need a full workspace install.
    enum:
      - small
      - medium
      - medium+
      - large
      - xlarge
      - 2xlarge
      - 2xlarge+
    type: enum
  skip-install:
    type: boolean
    default: true
    description: >
      When true (default), skip pnpm install — validators do not need workspace node_modules. Set
      false only if a custom verify path needs installed deps (and prefer a larger resource-class).
  verify-mode:
    type: enum
    enum:
      - changed
      - all
    default: changed
  workspace-at:
    type: string
    default: "."

steps:
  - setup:
      app-dir: << parameters.app-dir >>
      attach-workspace: << parameters.attach-workspace >>
      checkout: << parameters.checkout >>
      init-submodules: << parameters.init-submodules >>
      primary-branch: << parameters.primary-branch >>
      skip-pnpm-install: << parameters.skip-install >>
      workspace-at: << parameters.workspace-at >>
  - verify-release-manifest:
      app-dir: << parameters.app-dir >>
      mode: << parameters.verify-mode >>
      primary-branch: << parameters.primary-branch >>
